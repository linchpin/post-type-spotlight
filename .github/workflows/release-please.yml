name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name != 'pull_request' && github.event.pull_request.merged != true
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GH_BOT_TOKEN }}

  build:
    needs: release-please
    runs-on: ubuntu-latest
    if: ${{ needs.release-please.outputs.release_created }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get Version From Tag
        id: get_version
        uses: linchpin/action-get-latest-tag@v2.0.0
        with:
          semver_only: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` rather than `npm install`: a release artifact must come from
      # the lockfile, not from whatever the registry resolves on the day it is
      # cut.
      - name: Build plugin assets
        run: |
          npm ci
          npm run build

      - name: Verify the build produced the assets the plugin loads
        run: |
          set -e
          for asset in blocks/build/index.js blocks/build/index.asset.php; do
            if [ ! -s "$asset" ]; then
              echo "::error::Missing or empty build asset: $asset"
              exit 1
            fi
          done
          echo "Build output present"

      # Same script plugin-check.yml builds against, so the release zip and the
      # checked package cannot drift apart.
      - name: Build the distributable
        run: bash scripts/build.sh

      - name: Create the release zip
        run: |
          cd build
          zip -r ../post-type-spotlight.zip ./post-type-spotlight
          cd ..

      - name: Upload files to a GitHub release
        uses: svenstaro/upload-release-action@2.11.5
        with:
          repo_token: ${{ secrets.GH_BOT_TOKEN }}
          file: post-type-spotlight.zip
          tag: ${{ steps.get_version.outputs.tag }}
          asset_name: post-type-spotlight.zip
          overwrite: true
