name: Deploy to WordPress.org

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` rather than `npm install`: a release artifact must come from
      # the lockfile, not from whatever the registry resolves on the day it is
      # cut.
      - name: Build plugin assets
        run: |
          npm ci
          npm run build

      - name: Verify the build produced the assets the plugin loads
        run: |
          set -e
          for asset in blocks/build/index.js blocks/build/index.asset.php; do
            if [ ! -s "$asset" ]; then
              echo "::error::Missing or empty build asset: $asset"
              exit 1
            fi
          done
          echo "Build output present"

      - name: Install production Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

      - name: Drop dev dependencies from the package
        run: rm -rf node_modules

      - name: Strip the release-please markers from readme.txt
        # Without this the marker lines render as literal text in the Stable
        # tag block on the WordPress.org listing.
        # TODO: replace with linchpin/actions/actions/strip-release-markers@v4
        # once linchpin/actions#178 lands in a v4 release. Kept inline until
        # then so this workflow does not reference an action that does not
        # exist yet.
        run: |
          sed -i '/x-release-please-start-version/d' ./readme.txt
          sed -i '/x-release-please-end/d' ./readme.txt
          echo "Removed release-please marker lines from readme.txt"

      # The action reads .distignore itself, so it ships the same file set
      # scripts/build.sh produces.
      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # v2.3.0
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: post-type-spotlight
